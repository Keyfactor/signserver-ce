<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html" xmlns:f="http://java.sun.com/jsf/core">

    <f:metadata>
        <f:viewParam name="error" value="#{loginBean.errorCode}"/>
    </f:metadata>

    <body>
        <ui:composition template="WEB-INF/templates/template-notloggedin.xhtml">

            <ui:define name="title">
                <h:outputText value="#{text['Login']}"/>
            </ui:define>

            <ui:define name="top"/>

            <ui:define name="content">
                <h:panelGroup layout="block" styleClass="loginBox">
                    <h1>
                        <h:outputText value="#{text['Select_login']}"/>
                    </h1>
                    <h:panelGroup layout="block" styleClass="loginAlternativeBox">
                        <h:panelGroup layout="block" styleClass="loginAlternativeBox_header">
                            <ui:remove>
                                <!-- Eventually put client cert auth related icon here
                                <h:graphicImage library="#{adminWebBean.theme}" name="images/image.svg"/>
                                -->
                            </ui:remove>
                            <h:outputText value="#{text['Certificate']}"/>
                        </h:panelGroup>
                        <h:panelGroup layout="block" rendered="#{loginBean.clientCertificateAuthenticated}">
                            <p class="loginAlternativeBox_content">
                                <h:outputText value="#{text['Web_browser_presented_certificate']} #{loginBean.clientCert.subjectCN} (#{loginBean.clientCert.serialNumber})"/>
                            </p>
                            <p class="loginAlternativeBox_content">
                                <h:outputText value="#{text['Select_client_cert_login']}"/>
                            </p>
                            <h:form styleClass="loginAlternativeBox_content">
                                <h:commandButton styleClass="buttonNeutral" action="#{loginBean.validateLogin(true)}" value="Login"/>
                            </h:form>
                        </h:panelGroup>
                        <h:panelGroup layout="block" rendered="#{!loginBean.clientCertificateAuthenticated}">

                            <p class="loginAlternativeBox_content">
                                <h:outputText value="#{text['No_client_certificate_presented']}"/>
                            </p>
                            <p class="loginAlternativeBox_content">
                                <h:outputLink value="#{adminWebLinkBean.adminWebPrivateHttpsLink}">
                                    <h:outputText value="#{text['Use_TLS_client_certificate']}"/>
                                </h:outputLink>
                            </p>
                        </h:panelGroup>
                    </h:panelGroup>

                    <h:panelGroup layout="block" rendered="#{loginBean.oidcProviderUri != ''}" styleClass="loginAlternativeBox">
                        <h:panelGroup layout="block" styleClass="loginAlternativeBox_header">
                            <ui:remove>
                            <!-- Eventually put oidc auth related icon here
                            <h:graphicImage library="#{adminWebBean.theme}" name="images/image.svg"/>
                            -->
                            </ui:remove>
                            <h:outputText value="#{text['OIDC']}"/>
                        </h:panelGroup>
                        <h:panelGroup layout="block" rendered="#{loginBean.oidcAuthenticated}">
                            <p class="loginAlternativeBox_content">
                                <h:outputText value="#{text['Web_browser_presented_OIDC_token']} #{loginBean.clientTokens.subject}"/>
                            </p>
                            <h:panelGroup rendered="#{param['error'] != null}">
                                <p class="loginAlternativeBox_content errorMessage">
                                    <h:outputText value="#{loginBean.errorDisplayMessage()}"/>
                                </p>
                                <p class="loginAlternativeBox_content">
                                    <a href="logout.xhtml">Logout</a>
                                </p>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{param['error'] == null}">
                                <p class="loginAlternativeBox_content">
                                    <h:outputText value="#{text['Select_this_option_to_log_in_using_the_OIDC_token']}"/>
                                </p>
                                <h:form styleClass="loginAlternativeBox_content">
                                    <h:commandButton styleClass="buttonNeutral" action="#{loginBean.validateLogin(false)}" value="Login"/>
                                </h:form>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup layout="block" rendered="#{!loginBean.oidcAuthenticated}">
                            <p class="loginAlternativeBox_content">
                                <h:outputText value="#{text['No_OIDC_token_presented']}"/>
                            </p>

                            <h:panelGroup rendered="#{param['error'] != null}">
                                <p class="loginAlternativeBox_content errorMessage">
                                    <h:outputText value="#{loginBean.errorDisplayMessage()}" />
                                </p>
                            </h:panelGroup>

                            <p class="loginAlternativeBox_content">
                                <h:outputLink value="#{loginBean.oidcLoginLink}">
                                    <h:outputText value="#{text['Login_using_OIDC_provider']}"/>
                                </h:outputLink>
                            </p>
                        </h:panelGroup>
                    </h:panelGroup>
                </h:panelGroup>

            </ui:define>

            <ui:define name="bottom"/>
        </ui:composition>
    </body>
</html>
