        <ui:composition template="#{loginBean.loggedIn ? 'WEB-INF/templates/template.xhtml' : 'WEB-INF/templates/template-notloggedin.xhtml'}">
            <ui:param name="activeMenu" value="logout"/>

            <ui:define name="title">
                <h:outputText value="#{text['Logout']}"/>
            </ui:define>

            <ui:define name="top"/>

            <ui:define name="content">
                <h:panelGroup layout="block" styleClass="logoutBox">
                <h1><h:outputText value="#{text['Logout']}"/></h1>
                     <p>
                        Click below button to logout from the current session.
                    </p>
                    <p>
                        <h:form>
                            <h:commandButton class="buttonNeutral" action="#{loginBean.logout}" value="Logout"/>
                        </h:form>
                    </p>
                </h:panelGroup>


                
            </ui:define>

            <ui:define name="bottom"/>
